<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Rankify - Recommendations</title>

    <!-- Your main stylesheet -->
    <link rel="stylesheet" href="style.css">

    <!-- Recommendations page stylesheet -->
    <link rel="stylesheet" href="recommendations.css">
</head>

<body>

    <!-- ============================= -->

    <header class="navbar">
        <div class="container">

                <a href="index.html">Home</a>

    <main class="recommendations-page">

                <h2>Recommended Colleges</h2>

                <p>
                    Colleges matching your profile and preferences

            </div>

            <!-- MAIN LAYOUT -->

            <div class="recommendations-layout">

                <aside class="filter-card">

                    <div class="filter-header">
                        <h2>Filters</h2>

                        <button
                            type="button"
                            id="clearFilters"
                            class="clear-btn">
                            Clear All
                        </button>
                    </div>


                    <!-- College Name -->

                    <div class="filter-group">

                        <label for="collegeFilter">
                            Colleges
                        </label>

                        <select id="collegeFilter">

    <option value="">
        All Colleges
    </option>

    <option value="cet">
        Eligible via CET
    </option>

    <option value="jee">
        Eligible via JEE
    </option>

    <option value="both">
        Eligible via both
    </option>


</select>

                    </div>


                    <!-- Preferred City -->

        <option value="Thane">

        </option>

        <option value="Dhule">
            Dhule
        </option>

        <option value="Jalgaon">
            Jalgaon
        </option>

        <option value="Nandurbar">
            Nandurbar
        </option>

        <option value="Badlapur">
            Badlapur
        </option>

        <option value="Nashik">
            Nashik
        </option>

        <option value="Pune">
            Pune
        </option>

        <option value="Kolhapur">
            Kolhapur
        </option>

        <option value="Sangli">
            Sangli
        </option>

        <option value="Satara">
            Satara
        </option>

        <option value="Solapur">
            Solapur
        </option>

        <option value="Badnera">
            Badnera
        </option>

        <option value="Bhandara">
            Bhandara
        </option>

        <option value="Buldhana">
            Buldhana
        </option>

        <option value="Washim">
            Washim
        </option>

        <option value="Yavatmal">
            Yavatmal
        </option>

        <option value="Chandrapur">
            Chandrapur
        </option>

        <option value="Kajrat">
            Kajrata
        </option>

        <option value="Nagpur">
            Nagpur
        </option>

        <option value="Wardha">

                    <!-- University -->
<div class="filter-group">

    <label for="universityFilter">
        University
    </label>

    <select id="universityFilter">

        <option value="">
            All Universities
        </option>

        <option value="home-university">

                </aside>


                <!-- ============================= -->
                <!-- RESULTS SECTION -->
                <!-- ============================= -->

                <section class="results-section">


                    <!-- Results Header -->

                    <div class="results-header">

                        <div>
                            <h2>Your Matches</h2>

                            <p>
                                <span id="resultCount">0</span>
                                colleges found
                            </p>
                        </div>


                        <!-- Sorting -->

                        <div class="sort-box">

                            <label for="sortFilter">
                                Sort by
                            </label>

                            <select id="sortFilter">

                                <option value="match">
                                    Best Match
                                </option>

                                <!-- <option value="cutoff">
                                    Predicted Cutoff
                                </option> -->

                                <option value="name">
                                    College Name
                                </option>

                            </select>

                        </div>

                    </div>


                    <!-- ============================= -->
                    <!-- COLLEGE LIST -->
                    <!-- ============================= -->

                    <div id="collegeList" class="college-list">

                    </div>


                    <!-- No Results -->

                    <div
                        id="noResults"
                        class="no-results"
                        style="display: none;">

                        <h3>No colleges found</h3>

                        <p>
                            Try changing or clearing your filters.
                        </p>

                    </div>

                    <!-- ============================= -->
<!-- SAVED COLLEGES -->
<!-- ============================= -->

<div class="saved-colleges-action">

    <button
        type="button"
        id="viewSavedColleges">
        View Saved Colleges
    </button>

</div>

    <script src="recommendations.js"></script>
